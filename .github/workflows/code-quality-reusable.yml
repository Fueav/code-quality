name: code-quality reusable review

on:
  workflow_call:
    inputs:
      provider:
        description: "Native review provider: codex or claude"
        required: true
        type: string
      model:
        description: Optional provider model override
        required: false
        default: ""
        type: string
      reasoning_effort:
        description: Provider reasoning effort
        required: false
        default: low
        type: string
      artifact_retention_days:
        description: Number of days to retain frozen review evidence
        required: false
        default: 14
        type: number
jobs:
  review:
    name: ${{ inputs.provider }} report-only review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.private == true &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: code-quality
      labels: [self-hosted, linux, code-quality]
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: quality-review-${{ github.repository }}-pr-${{ github.event.pull_request.number }}-${{ inputs.provider }}
      cancel-in-progress: true

    steps:
      - name: Validate workflow inputs
        env:
          PROVIDER: ${{ inputs.provider }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_TIP_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -eu
          case "$PROVIDER" in
            codex | claude) ;;
            *) echo "provider must be codex or claude" >&2; exit 2 ;;
          esac
          case "$REASONING_EFFORT" in
            low | medium | high | max) ;;
            *) echo "reasoning_effort must be low, medium, high, or max" >&2; exit 2 ;;
          esac
          printf '%s\n' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          printf '%s\n' "$BASE_TIP_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s\n' "$TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$ARTIFACT_RETENTION_DAYS" -ge 1
          test "$ARTIFACT_RETENTION_DAYS" -le 90

      - name: Check out the exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify quality-review v0.5.2
        run: |
          set -eu
          review_bin=$(command -v quality-review)
          test "$("$review_bin" version)" = 'quality-review v0.5.2'
          printf 'QUALITY_REVIEW_BIN=%s\n' "$review_bin" >> "$GITHUB_ENV"
          printf 'QUALITY_REVIEW_OUTPUT_ROOT=%s\n' "$RUNNER_TEMP/code-quality" >> "$GITHUB_ENV"

      - name: Doctor Codex
        id: codex_doctor
        if: inputs.provider == 'codex'
        run: |
          set -euo pipefail
          "$QUALITY_REVIEW_BIN" doctor --host codex --repo "$GITHUB_WORKSPACE" \
            --execution-profile production-ci |
            tee "$RUNNER_TEMP/quality-review-doctor-codex.json"

      - name: Doctor Claude Code
        id: claude_doctor
        if: inputs.provider == 'claude'
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -euo pipefail
          "$QUALITY_REVIEW_BIN" doctor --host claude-code --repo "$GITHUB_WORKSPACE" \
            --execution-profile production-ci |
            tee "$RUNNER_TEMP/quality-review-doctor-claude.json"

      - name: Run Codex report-only review
        id: codex_review
        if: inputs.provider == 'codex'
        continue-on-error: true
        env:
          MODEL: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        run: |
          set -euo pipefail
          model="$MODEL"
          if [ -z "$model" ]; then model='gpt-5.6-sol'; fi
          "$QUALITY_REVIEW_BIN" run-codex --repo "$GITHUB_WORKSPACE" \
            --execution-profile production-ci \
            --model "$model" --reasoning-effort "$REASONING_EFFORT" \
            --output-root "$QUALITY_REVIEW_OUTPUT_ROOT" |
            tee "$RUNNER_TEMP/quality-review-run-codex.json"

      - name: Run Claude report-only review
        id: claude_review
        if: inputs.provider == 'claude'
        continue-on-error: true
        env:
          MODEL: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          DISABLE_AUTOUPDATER: "1"
        run: |
          set -euo pipefail
          model="$MODEL"
          if [ -z "$model" ]; then model='sonnet'; fi
          "$QUALITY_REVIEW_BIN" run-claude --repo "$GITHUB_WORKSPACE" \
            --execution-profile production-ci \
            --model "$model" --reasoning-effort "$REASONING_EFFORT" \
            --output-root "$QUALITY_REVIEW_OUTPUT_ROOT" |
            tee "$RUNNER_TEMP/quality-review-run-claude.json"

      - name: Publish job summary
        if: always()
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -eu
          output_root="${QUALITY_REVIEW_OUTPUT_ROOT:-$RUNNER_TEMP/code-quality}"
          summary_file=''
          for candidate in \
            "$RUNNER_TEMP/quality-review-run-codex.json" \
            "$RUNNER_TEMP/quality-review-run-claude.json"; do
            if [ -s "$candidate" ]; then summary_file="$candidate"; break; fi
          done
          {
            echo '## code-quality'
            echo
            echo "- Provider: \`$PROVIDER\`"
            if [ -n "$summary_file" ]; then
              echo "- Status: \`$(jq -r '.status' "$summary_file")\`"
              echo "- Semantic result: \`$(jq -r '.semantic_result' "$summary_file")\`"
              echo "- Provider invocations: \`$(jq -r '.provider_invocations' "$summary_file")\`"
            else
              echo '- Status: `NOT_RUN`'
              echo '- Inspect the doctor artifact for the blocking reason.'
            fi
            native_review=$(find "$output_root" -path '*/output/native-review.txt' -type f -print -quit 2>/dev/null || true)
            if [ -n "$native_review" ]; then
              echo
              echo '### Frozen native review'
              echo
              sed -n '1,240p' "$native_review" | sed 's/^/> /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frozen review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-quality-pr-${{ github.event.pull_request.number }}-${{ inputs.provider }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/quality-review
            ${{ runner.temp }}/quality-review-doctor-*.json
            ${{ runner.temp }}/quality-review-run-*.json
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Verify checkout remained unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce execution health
        if: always()
        env:
          PROVIDER: ${{ inputs.provider }}
          CODEX_DOCTOR_OUTCOME: ${{ steps.codex_doctor.outcome }}
          CODEX_REVIEW_OUTCOME: ${{ steps.codex_review.outcome }}
          CLAUDE_DOCTOR_OUTCOME: ${{ steps.claude_doctor.outcome }}
          CLAUDE_REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
        run: |
          set -eu
          case "$PROVIDER" in
            codex)
              test "$CODEX_DOCTOR_OUTCOME" = success
              test "$CODEX_REVIEW_OUTCOME" = success
              ;;
            claude)
              test "$CLAUDE_DOCTOR_OUTCOME" = success
              test "$CLAUDE_REVIEW_OUTCOME" = success
              ;;
            *) exit 2 ;;
          esac
