name: code-quality reusable review

on:
  workflow_call:
    inputs:
      provider:
        description: "Native review provider: codex or claude"
        required: true
        type: string
      model:
        description: Optional provider model override
        required: false
        default: ""
        type: string
      reasoning_effort:
        description: Provider reasoning effort
        required: false
        default: max
        type: string
      artifact_retention_days:
        description: Number of days to retain frozen review evidence
        required: false
        default: 14
        type: number
jobs:
  review:
    name: ${{ inputs.provider }} release-gate review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.private == true &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: code-quality
      labels: [self-hosted, linux, code-quality]
    timeout-minutes: 70
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: quality-review-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      QUALITY_REVIEW_STATE_ROOT: ${{ vars.CODE_QUALITY_STATE_ROOT }}
      QUALITY_REVIEW_RUNNER_POLICY: ${{ vars.CODE_QUALITY_RUNNER_POLICY_VERSION }}
      QUALITY_REVIEW_EXECUTION_ATTESTATION: ${{ vars.CODE_QUALITY_EXECUTION_FINGERPRINT }}

    steps:
      - name: Validate workflow inputs
        env:
          PROVIDER: ${{ inputs.provider }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_TIP_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -eu
          case "$PROVIDER" in
            codex | claude) ;;
            *) echo "provider must be codex or claude" >&2; exit 2 ;;
          esac
          case "$REASONING_EFFORT" in
            low | medium | high | max) ;;
            *) echo "reasoning_effort must be low, medium, high, or max" >&2; exit 2 ;;
          esac
          printf '%s\n' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          printf '%s\n' "$BASE_TIP_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s\n' "$TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$ARTIFACT_RETENTION_DAYS" -ge 1
          test "$ARTIFACT_RETENTION_DAYS" -le 90
          case "$QUALITY_REVIEW_STATE_ROOT" in /*) ;; *) echo 'A persistent absolute CODE_QUALITY_STATE_ROOT is required' >&2; exit 2 ;; esac
          test -n "$QUALITY_REVIEW_RUNNER_POLICY"
          test -n "$QUALITY_REVIEW_EXECUTION_ATTESTATION"

      - name: Check out the exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify quality-review v0.6.0
        run: |
          set -eu
          review_bin=$(command -v quality-review)
          test "$("$review_bin" version)" = 'quality-review v0.6.0'
          printf 'QUALITY_REVIEW_BIN=%s\n' "$review_bin" >> "$GITHUB_ENV"
          printf 'QUALITY_REVIEW_OUTPUT_ROOT=%s\n' "$QUALITY_REVIEW_STATE_ROOT" >> "$GITHUB_ENV"

      - name: Resolve one review contract
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL_INPUT: ${{ inputs.model }}
          REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        run: |
          set -eu
          case "$PROVIDER" in
            codex)
              host=codex
              command=run-codex
              default_model=gpt-5.6-sol
              ;;
            claude)
              host=claude-code
              command=run-claude
              default_model=sonnet
              ;;
            *) exit 2 ;;
          esac
          model="$MODEL_INPUT"
          if [ -z "$model" ]; then model="$default_model"; fi
          export PROVIDER_VERSION
          PROVIDER_VERSION=$("$PROVIDER" --version)
          fingerprint=$(python3 -I -c 'import hashlib,json,os; print(hashlib.sha256(json.dumps([os.environ["PROVIDER_VERSION"],os.environ["QUALITY_REVIEW_EXECUTION_ATTESTATION"]]).encode()).hexdigest())')
          {
            printf 'QUALITY_REVIEW_HOST=%s\n' "$host"
            printf 'QUALITY_REVIEW_COMMAND=%s\n' "$command"
            printf 'QUALITY_REVIEW_MODEL=%s\n' "$model"
            printf 'QUALITY_REVIEW_REASONING_EFFORT=%s\n' "$REASONING_EFFORT"
            printf 'QUALITY_REVIEW_EXECUTION_PROFILE=production-ci\n'
            printf 'DISABLE_AUTOUPDATER=1\n'
            printf 'QUALITY_REVIEW_FINGERPRINT=%s\n' "$fingerprint"
          } >> "$GITHUB_ENV"

      - name: Run release-gate review
        id: review_run
        continue-on-error: true
        run: |
          set -euo pipefail
          "$QUALITY_REVIEW_BIN" "$QUALITY_REVIEW_COMMAND" --repo "$GITHUB_WORKSPACE" \
            --model "$QUALITY_REVIEW_MODEL" \
            --reasoning-effort "$QUALITY_REVIEW_REASONING_EFFORT" \
            --execution-profile "$QUALITY_REVIEW_EXECUTION_PROFILE" \
            --state-root "$QUALITY_REVIEW_STATE_ROOT" \
            --runner-policy-version "$QUALITY_REVIEW_RUNNER_POLICY" \
            --execution-fingerprint "$QUALITY_REVIEW_FINGERPRINT" \
            --total-timeout 65m --finalize-reserve 5m --progress-format jsonl |
            tee "$RUNNER_TEMP/quality-review-run.json"

      - name: Verify current PR base and head
        id: current_target
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pulls/' + os.environ['PR_NUMBER']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)
          matched = current['base']['sha'] == os.environ['EXPECTED_BASE'] and current['head']['sha'] == os.environ['EXPECTED_HEAD']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'quality-review-publication.json').write_text(json.dumps({'lifecycle_status': 'CURRENT' if matched else 'SUPERSEDED', 'current_base': current['base']['sha'], 'current_head': current['head']['sha']}))
          if not matched:
              raise SystemExit('Review is SUPERSEDED; the current PR requires its own review evidence.')
          PY

      - name: Package exact review session
        id: package
        if: always()
        run: |
          set -eu
          "$QUALITY_REVIEW_BIN" package-evidence \
            --run "$RUNNER_TEMP/quality-review-run.json" \
            --evidence-root "$QUALITY_REVIEW_OUTPUT_ROOT" \
            --destination "$RUNNER_TEMP/code-quality-artifact"
          cp "$RUNNER_TEMP/quality-review-publication.json" "$RUNNER_TEMP/code-quality-artifact/publication.json"

      - name: Publish job summary
        if: always()
        env:
          CURRENT_OUTCOME: ${{ steps.current_target.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          set -eu
          review_summary="$RUNNER_TEMP/code-quality-artifact/review-summary.md"
          if [ "$CURRENT_OUTCOME" = success ] && [ "$PACKAGE_OUTCOME" = success ] && [ -f "$review_summary" ]; then
            cat "$review_summary" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '# ⚠️ AI Code Review: ERROR'
              echo
              echo 'Release: `HOLD`'
              echo
              echo 'The review has no current, verified publication. Inspect the execution and publication evidence.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frozen review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-quality-pr-${{ github.event.pull_request.number }}-${{ inputs.provider }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/code-quality-artifact
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Verify checkout remained unchanged
        if: always()
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enforce execution health
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.review_run.outcome }}
          CURRENT_OUTCOME: ${{ steps.current_target.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          set -eu
          test "$RUN_OUTCOME" = success
          test "$CURRENT_OUTCOME" = success
          test "$PACKAGE_OUTCOME" = success
