  background: var(--secondary);

  text-align: center;

  height: 14px;

  pointer-events: none;

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;

.form-check-label {

.form-switch .form-check-input {

  height: 20px;

  background: var(--muted);

    &lt;div class=&quot;hero-copy&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;公司 AI 代码检查 · 第一阶段 V1.1 评审稿&lt;/p&gt;
      &lt;h1&gt;代码质量底线规则与 Agent 判定标准&lt;/h1&gt;
      &lt;p&gt;V1.1 继续只定义第一阶段必须拦住的严重低级错误，并把首次实战暴露出的判定、报告和资源约束变成可执行合同。本稿仍处于团队评审与试点阶段，不是固定的公司终版标准。&lt;/p&gt;
      &lt;p class=&quot;meta&quot;&gt;版本：V1.1 · 日期：2026-07-15 · 状态：团队评审与试点中 · 配套总方案：&lt;a href=&quot;2026-07-14-company-ai-code-review-overview.html&quot;&gt;公司 AI 代码检查方案&lt;/a&gt;&lt;/p&gt;

      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;kicker&quot;&gt;检查范围&lt;/span&gt;&lt;span class=&quot;summary-value&quot;&gt;4 个底线维度&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;kicker&quot;&gt;规则规模&lt;/span&gt;&lt;span class=&quot;summary-value&quot;&gt;20 条底线规则&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;kicker&quot;&gt;阻断门槛&lt;/span&gt;&lt;span class=&quot;summary-value&quot;&gt;S3 + T3 + E2/E3&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;kicker&quot;&gt;默认资源&lt;/span&gt;&lt;span class=&quot;summary-value&quot;&gt;最多 3 个 Agent&lt;/span&gt;&lt;/div&gt;

  &lt;section id=&quot;positioning&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;01 · Positioning&lt;/p&gt;
      &lt;h2&gt;第一阶段只守住生产底线&lt;/h2&gt;
      &lt;p&gt;第一阶段追求少报、报准，只阻断具备明确变更归因、现实触发事实、完整因果链和严重后果的底线缺陷。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;&lt;strong&gt;核心定义：&lt;/strong&gt;&lt;code&gt;PASS&lt;/code&gt; 表示“没有发现满足阻断条件的底线缺陷”，不表示“代码优秀”。&lt;/p&gt;
      &lt;p&gt;存量问题只有在本次提交引入、扩大影响或使其可触发时，才进入阻断判断。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;plain-group&quot;&gt;
        &lt;h3&gt;第一阶段需要拦住&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;方案方向明显错误，并会随真实业务规模快速恶化。&lt;/li&gt;
          &lt;li&gt;会直接产生严重业务错误、数据损坏或资金错误。&lt;/li&gt;
          &lt;li&gt;上线后会造成中断、资源失控、重试风暴或永久卡死。&lt;/li&gt;
          &lt;li&gt;会造成高影响安全事故、破坏性兼容变更或不可恢复发布。&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plain-group&quot;&gt;
        &lt;h3&gt;第一阶段明确不评判&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;命名、格式、代码风格和注释完整度。&lt;/li&gt;
          &lt;li&gt;抽象是否优雅、少量重复和普通函数复杂度。&lt;/li&gt;
          &lt;li&gt;全面测试覆盖率与全面可观测性成熟度。&lt;/li&gt;
          &lt;li&gt;没有规模或运行依据的性能猜测。&lt;/li&gt;
          &lt;li&gt;“还有更漂亮的写法”一类个人偏好。&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;baseline&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;02 · Review Baseline&lt;/p&gt;
      &lt;h2&gt;先固定审查基线，再判断是否由本次变更引入&lt;/h2&gt;
      &lt;p&gt;CI 或调用方必须提供明确的 base、target 和 diff 选择理由。Agent 不得在 upstream diff 为空时静默改用更大的比较范围。&lt;/p&gt;
    &lt;/div&gt;
    &lt;pre&gt;&lt;code&gt;repository:
target_branch:
base_commit:
target_commit:
diff_selection_reason:
changed_files:
affected_entries:&lt;/code&gt;&lt;/pre&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;如果 &lt;code&gt;base_commit&lt;/code&gt;、&lt;code&gt;target_commit&lt;/code&gt; 或 &lt;code&gt;diff_selection_reason&lt;/code&gt; 缺失，无法证明 &lt;code&gt;introduced_or_worsened_by_change&lt;/code&gt;，总体结果最高只能是 &lt;code&gt;INCOMPLETE&lt;/code&gt; 或 &lt;code&gt;MANUAL_REVIEW&lt;/code&gt;，不得 &lt;code&gt;BLOCK&lt;/code&gt;。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;dimensions&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;03 · Dimensions&lt;/p&gt;
      &lt;h2&gt;四个底线维度&lt;/h2&gt;
      &lt;p&gt;按“方案是否做对事情 → 结果是否正确 → 生产能否稳定运行 → 能否安全兼容地上线”的顺序检查。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;维度&lt;/th&gt;&lt;th&gt;核心问题&lt;/th&gt;&lt;th&gt;严重影响&lt;/th&gt;&lt;th&gt;规则数&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;D1 方案方向与数据流&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;代码是否在高质量地实现一个明显错误的业务方案？&lt;/td&gt;&lt;td&gt;工作量乘法放大、任务永远追不上、错误真相源、同步链路被批处理拖垮&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;D2 业务结果与数据安全&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;正常、异常、重复执行和边界条件下，业务结果与数据是否正确？&lt;/td&gt;&lt;td&gt;错误结果、非法状态、资金错误、部分写入、重复副作用&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;D3 生产稳定性&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;在失败、并发、资源增长和关闭过程中，系统是否会失控？&lt;/td&gt;&lt;td&gt;中断、雪崩、死锁、泄漏、无限重试、永久卡死&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;D4 安全与上线变更安全&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;是否会造成权限、输入、敏感数据、兼容性或迁移事故？&lt;/td&gt;&lt;td&gt;越权、注入、泄密、破坏调用方、身份映射断裂、数据丢失&lt;/td&gt;&lt;td&gt;5&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;rules&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;04 · Baseline Rules&lt;/p&gt;
      &lt;h2&gt;第一阶段 20 条底线规则&lt;/h2&gt;
      &lt;p&gt;每条规则同时给出阻断边界和不得阻断的边界。多个规则指向同一根因时必须合并。&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rule-family&quot;&gt;
      &lt;div class=&quot;family-title&quot;&gt;&lt;h3&gt;D1 方案方向与数据流&lt;/h3&gt;&lt;span class=&quot;badge-neutral&quot;&gt;DES-001 ～ DES-005&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;rule-table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;ID&lt;/th&gt;&lt;th&gt;底线规则&lt;/th&gt;&lt;th&gt;允许阻断的典型情形&lt;/th&gt;&lt;th&gt;不得直接阻断的边界&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;DES-001&lt;/code&gt;&lt;/td&gt;&lt;td&gt;处理驱动方向不得明显颠倒，导致两个持续增长的集合形成乘法级工作量。&lt;/td&gt;&lt;td&gt;调用链证明工作量接近 &lt;code&gt;N × M&lt;/code&gt;，真实规模证明任务无法按期完成、成本失控或持续积压。&lt;/td&gt;&lt;td&gt;某一维度有严格小上限；存在有界高效反向索引；缺少规模依据时只能人工确认。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;DES-002&lt;/code&gt;&lt;/td&gt;&lt;td&gt;存在自然增量游标或检查点时，不得在高频路径反复全量处理历史数据。&lt;/td&gt;&lt;td&gt;任务每次从头扫描持续增长的历史集合，执行周期必然超过调度周期。&lt;/td&gt;&lt;td&gt;数据集被明确限定；正确性要求全量校验且频率与成本已证明可接受。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;DES-003&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不得在无界或持续增长的循环中逐条调用数据库、RPC 或第三方服务。&lt;/td&gt;&lt;td&gt;远程请求随记录数线性或更高增长，且缺少批量、索引、分页或并发上限。&lt;/td&gt;&lt;td&gt;列表有严格小上限；供应方只支持逐条调用且限流、调度和完成时间均有证据满足要求。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;DES-004&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不得选错权威数据源，或形成无法保证一致性的多个真相源。&lt;/td&gt;&lt;td&gt;核心决策可能从冲突数据源读取，双写失败后没有恢复或确定优先级。&lt;/td&gt;&lt;td&gt;缓存具有清晰版本、失效与回源机制；副本只用于读取加速。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;DES-005&lt;/code&gt;&lt;/td&gt;&lt;td&gt;明显属于长耗时批处理的工作，不得直接放入同步请求关键链路。&lt;/td&gt;&lt;td&gt;请求等待无界扫描、批量回填或大量外部调用，导致超时、连接耗尽或级联故障。&lt;/td&gt;&lt;td&gt;工作量严格有界并满足延迟目标；异步会破坏明确强一致要求。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rule-family&quot;&gt;
      &lt;div class=&quot;family-title&quot;&gt;&lt;h3&gt;D2 业务结果与数据安全&lt;/h3&gt;&lt;span class=&quot;badge-neutral&quot;&gt;COR-001 ～ COR-005&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;rule-table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;ID&lt;/th&gt;&lt;th&gt;底线规则&lt;/th&gt;&lt;th&gt;允许阻断的典型情形&lt;/th&gt;&lt;th&gt;不得直接阻断的边界&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;COR-001&lt;/code&gt;&lt;/td&gt;&lt;td&gt;实现不得与明确的业务规则、Spec 或公共接口契约相反。&lt;/td&gt;&lt;td&gt;代码与已确认契约直接矛盾，并在明确输入下返回错误结果或执行错误动作。&lt;/td&gt;&lt;td&gt;需求存在多种合理解释或尚未确认时只能人工确认。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;COR-002&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不得破坏关键业务不变量或允许系统进入非法状态。&lt;/td&gt;&lt;td&gt;余额、库存、所有权、状态机、唯一性或领域约束可被明确路径破坏。&lt;/td&gt;&lt;td&gt;不变量没有文档或代码依据；仅认为另一种设计更优。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;COR-003&lt;/code&gt;&lt;/td&gt;&lt;td&gt;金额、数量、精度、时间、分页和边界计算不得产生明确错误。&lt;/td&gt;&lt;td&gt;溢出、舍入、时区、单位、包含边界或游标错误造成资金、遗漏或重复处理。&lt;/td&gt;&lt;td&gt;仅有格式偏好；误差由业务明确接受；没有实际触发输入。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;COR-004&lt;/code&gt;&lt;/td&gt;&lt;td&gt;事务边界不得使失败操作留下不可接受的部分成功状态。&lt;/td&gt;&lt;td&gt;核心多步写入失败后留下无法自动恢复的不一致或错误对外状态。&lt;/td&gt;&lt;td&gt;业务允许最终一致，且补偿、重试、对账和幂等路径完整可证。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;COR-005&lt;/code&gt;&lt;/td&gt;&lt;td&gt;重试、重复请求或重复消费不得重复产生不可逆业务副作用。&lt;/td&gt;&lt;td&gt;重复到达造成重复扣款、记账、发放、通知或外部操作。&lt;/td&gt;&lt;td&gt;操作天然幂等，或唯一约束、幂等键和状态检查直接证明安全。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rule-family&quot;&gt;
      &lt;div class=&quot;family-title&quot;&gt;&lt;h3&gt;D3 生产稳定性&lt;/h3&gt;&lt;span class=&quot;badge-neutral&quot;&gt;REL-001 ～ REL-005&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;rule-table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;ID&lt;/th&gt;&lt;th&gt;底线规则&lt;/th&gt;&lt;th&gt;允许阻断的典型情形&lt;/th&gt;&lt;th&gt;不得直接阻断的边界&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;REL-001&lt;/code&gt;&lt;/td&gt;&lt;td&gt;内存、并发数、goroutine、队列、循环和结果集不得随外部输入无界增长。&lt;/td&gt;&lt;td&gt;用户流量或正常数据增长持续创建资源直到 OOM、连接耗尽或服务不可用。&lt;/td&gt;&lt;td&gt;上游和本地都有可证明硬上限；资源按批释放且峰值满足容量。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;REL-002&lt;/code&gt;&lt;/td&gt;&lt;td&gt;外部调用和长耗时操作必须具有必要的超时、取消或终止条件。&lt;/td&gt;&lt;td&gt;下游不返回时永久占用请求、线程、连接或任务租约并持续积累。&lt;/td&gt;&lt;td&gt;底层库统一强制超时；协议要求等待且有其他明确全局终止机制。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;REL-003&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不得存在可直接证明的数据竞争、死锁、丢失更新或顺序依赖错误。&lt;/td&gt;&lt;td&gt;真实并发路径同时修改共享状态，导致结果丢失、卡死或重复处理。&lt;/td&gt;&lt;td&gt;串行性、锁、事务隔离或单线程模型可从代码和配置直接证明。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;REL-004&lt;/code&gt;&lt;/td&gt;&lt;td&gt;文件、连接、锁、事务和后台任务必须能够正确释放或关闭。&lt;/td&gt;&lt;td&gt;正常错误或取消路径持续泄漏关键资源，最终造成不可用或数据锁死。&lt;/td&gt;&lt;td&gt;资源由框架托管并有明确生命周期；对象局部、短期且有硬上限。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;REL-005&lt;/code&gt;&lt;/td&gt;&lt;td&gt;错误处理不得导致无限重试、重试风暴、进程崩溃、永久卡死或关键错误完全静默。&lt;/td&gt;&lt;td&gt;稳定错误触发零间隔重试、永不确认消息、退出关键进程或吞掉数据错误。&lt;/td&gt;&lt;td&gt;退出是受监督任务的明确恢复策略；上层统一记录、限次重试并告警。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;rule-family&quot;&gt;
      &lt;div class=&quot;family-title&quot;&gt;&lt;h3&gt;D4 安全与上线变更安全&lt;/h3&gt;&lt;span class=&quot;badge-neutral&quot;&gt;SEC-001 ～ CHG-002&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;table-wrap&quot;&gt;&lt;table class=&quot;rule-table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;ID&lt;/th&gt;&lt;th&gt;底线规则&lt;/th&gt;&lt;th&gt;允许阻断的典型情形&lt;/th&gt;&lt;th&gt;不得直接阻断的边界&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;SEC-001&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不得绕过认证、授权、角色、资源所有权或租户隔离。&lt;/td&gt;&lt;td&gt;未授权主体通过明确请求读取、修改或执行受保护资源。&lt;/td&gt;&lt;td&gt;入口由不可绕过的上层网关保护；资源本身明确公开。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;SEC-002&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不可信输入不得未经约束进入查询、命令、模板、路径或网络请求。&lt;/td&gt;&lt;td&gt;存在可构造的注入、目录穿越、SSRF、危险反序列化或命令执行路径。&lt;/td&gt;&lt;td&gt;参数化、允许列表、规范化和目标限制直接证明输入无法改变执行结构。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;SEC-003&lt;/code&gt;&lt;/td&gt;&lt;td&gt;密钥、令牌、密码和敏感业务数据不得被提交、输出或不当暴露。&lt;/td&gt;&lt;td&gt;有效凭证进入仓库或响应；日志输出可复用凭证、完整隐私数据或签名材料。&lt;/td&gt;&lt;td&gt;明确测试假数据；批准且不可逆脱敏的数据；仅凭变量名猜测敏感性。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;CHG-001&lt;/code&gt;&lt;/td&gt;&lt;td&gt;不得在未声明和未处理兼容性的情况下破坏现有调用方、已有配置或稳定身份与所有权映射。&lt;br&gt;&lt;strong&gt;A 公共协议与接口：&lt;/strong&gt;请求语法、认证方案、响应字段、状态码、事件和公开格式。&lt;br&gt;&lt;strong&gt;B 配置语义：&lt;/strong&gt;已有配置继续被读取并保持原意。&lt;br&gt;&lt;strong&gt;C 持久化身份与所有权兼容性：&lt;/strong&gt;用户、租户、资源所有权、幂等、缓存和外部账户稳定标识的派生方式。&lt;/td&gt;&lt;td&gt;现有调用方解析失败；配置被静默忽略或改义；所有权键改变导致存量数据无法访问；滚动发布时新旧版本语义冲突。&lt;/td&gt;&lt;td&gt;调用方与服务原子发布且有证据；完整版本化迁移、双读或兼容路径已验证；接口尚未发布且无使用方。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;CHG-002&lt;/code&gt;&lt;/td&gt;&lt;td&gt;数据迁移和发布方式不得造成数据丢失、不可恢复状态、关键表长期阻塞或新旧版本无法共存。&lt;/td&gt;&lt;td&gt;删除或重写生产数据、先部署依赖尚不存在结构的代码，且无安全迁移路径。&lt;/td&gt;&lt;td&gt;小型受控数据集；已有备份、分阶段迁移、回填验证和回滚演练证据。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;decision&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;05 · Decision Gate&lt;/p&gt;
      &lt;h2&gt;后果、触发确定性与证据共同决定结果&lt;/h2&gt;
      &lt;p&gt;严重后果不代表当前环境一定会触发。V1.1 将两者拆开，避免把理论最坏情况直接当成阻断事实。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;three-col&quot;&gt;
      &lt;div class=&quot;plain-group&quot;&gt;&lt;span class=&quot;badge-gate&quot;&gt;S3 严重&lt;/span&gt;&lt;p&gt;触发后造成中断、关键数据损坏、资金错误、高影响越权、不可恢复发布或不可控成本。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;plain-group&quot;&gt;&lt;span class=&quot;badge-manual&quot;&gt;S2 有限&lt;/span&gt;&lt;p&gt;问题真实但影响有限或容易恢复，不得自动阻断。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;plain-group&quot;&gt;&lt;span class=&quot;badge-neutral&quot;&gt;S1 改进&lt;/span&gt;&lt;p&gt;工程、维护性或风格建议，不进入正式问题列表。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;触发确定性&lt;/th&gt;&lt;th&gt;定义&lt;/th&gt;&lt;th&gt;处理&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T3 已证明&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;目标部署、现有配置、真实调用方或确定输入会触发。&lt;/td&gt;&lt;td&gt;满足其他门槛时可进入阻断。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T2 条件现实&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;触发条件具体且现实，但尚未证明当前环境满足。&lt;/td&gt;&lt;td&gt;&lt;code&gt;MANUAL_REVIEW&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;T1 理论风险&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;只有模式或理论可能性。&lt;/td&gt;&lt;td&gt;不得阻断。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;证据等级&lt;/th&gt;&lt;th&gt;定义&lt;/th&gt;&lt;th&gt;协议结论边界&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;E3 已验证&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;测试、命令、日志、静态工具或最小复现证实。&lt;/td&gt;&lt;td&gt;实际请求、测试或复现验证。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;E2 代码证实&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;真实入口到生产影响可完整推导。&lt;/td&gt;&lt;td&gt;必须引用仓库契约、官方标准、框架行为或既有测试。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;strong&gt;E1 存疑&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;缺少业务、规模、运行或权威契约。&lt;/td&gt;&lt;td&gt;只凭模型记忆最高为 E1。&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;统一场景&lt;/th&gt;&lt;th&gt;结果&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;code&gt;S3 + T3 + E2/E3 + 本次引入 + 完整因果链&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;BLOCK&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;code&gt;S3 + T2 + E2/E3&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;MANUAL_REVIEW&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;code&gt;S2 + T3 + E3&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;MANUAL_REVIEW&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;报告字段缺失或基线不明确&lt;/td&gt;&lt;td&gt;&lt;code&gt;INCOMPLETE&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;
      &lt;h3&gt;唯一阻断公式&lt;/h3&gt;
      &lt;pre&gt;&lt;code&gt;BLOCK =
    severity == S3
    AND trigger_confidence == T3
    AND evidence_level IN (E2, E3)
    AND introduced_or_worsened_by_change == true
    AND trigger_condition_is_concrete == true
    AND causal_chain_is_complete == true
    AND finding_is_not_style_preference == true&lt;/code&gt;&lt;/pre&gt;
    &lt;/div&gt;
    &lt;div class=&quot;decision-strip&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge-neutral&quot;&gt;PASS&lt;/span&gt;&lt;span&gt;未发现满足阻断条件的底线缺陷。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge-manual&quot;&gt;MANUAL_REVIEW&lt;/span&gt;&lt;span&gt;问题可能严重，但触发事实或证据不足；例如 S3 + T2 + E2/E3。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;badge-gate&quot;&gt;BLOCK&lt;/span&gt;&lt;span&gt;本次改动引入了 S3、T3 且 E2/E3 的完整底线缺陷。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;p&gt;&lt;strong&gt;INCOMPLETE：&lt;/strong&gt;基线不明确、强制字段缺失、枚举非法、检查超时或执行失败。总体结果优先级为 &lt;code&gt;INCOMPLETE &amp;gt; BLOCK &amp;gt; MANUAL_REVIEW &amp;gt; PASS&lt;/code&gt;；INCOMPLETE 不能当作 PASS。&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;agent&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;06 · Agent Workflow&lt;/p&gt;
      &lt;h2&gt;沿真实业务路径检查，并限制代理扇出&lt;/h2&gt;
      &lt;p&gt;Agent 可阅读改动之外的相关代码，但发现必须与明确审查基线有关。普通 CI 负责稳定工具检查。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;plain-group&quot;&gt;
        &lt;h3&gt;执行步骤&lt;/h3&gt;
        &lt;ol&gt;
          &lt;li&gt;确认 base/target、改动目标和实际改变的行为。&lt;/li&gt;
          &lt;li&gt;找到真实入口，追踪调用链、数据流和副作用。&lt;/li&gt;
          &lt;li&gt;只激活与本次改动相关的规则族。&lt;/li&gt;
          &lt;li&gt;形成候选并合并相同根因。&lt;/li&gt;
          &lt;li&gt;验证是否由本次改动引入或加重。&lt;/li&gt;
          &lt;li&gt;每个候选最多交给一个独立验证 Agent。&lt;/li&gt;
          &lt;li&gt;输出机器合同，由普通程序计算最终 verdict。&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plain-group&quot;&gt;
        &lt;h3&gt;硬资源限制&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;默认总 Agent 数不超过 3，包括主 Agent。&lt;/strong&gt;&lt;/li&gt;
          &lt;li&gt;不得为每条规则、每个文件或每个角度分别启动 Agent。&lt;/li&gt;
          &lt;li&gt;没有候选时不得启动验证 Agent。&lt;/li&gt;
          &lt;li&gt;超过 3 个必须由 CI 配置或人工显式允许。&lt;/li&gt;
          &lt;li&gt;报告记录计划数量、实际数量、原因、token、耗时和重试。&lt;/li&gt;
          &lt;li&gt;自然语言“节制使用”不能替代执行器硬上限。&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;contract&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;07 · Machine Contract&lt;/p&gt;
      &lt;h2&gt;每条发现必须可校验、可定位、可行动&lt;/h2&gt;
      &lt;p&gt;模型负责收集事实和解释因果链；普通程序负责校验字段并计算最终 verdict。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;plain-group&quot;&gt;
        &lt;h3&gt;单条发现强制字段&lt;/h3&gt;
        &lt;pre&gt;&lt;code&gt;rule_id:
verdict:
severity:
trigger_confidence:
evidence_level:
introduced_or_worsened_by_change:
code_locations:
affected_call_path:
trigger_condition:

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
