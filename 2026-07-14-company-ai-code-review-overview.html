&lt;section id=&quot;why&quot; aria-labelledby=&quot;why-title&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;why-title&quot;&gt;为什么需要 V1.1&lt;/h2&gt;&lt;p&gt;首次实战证明生产底线方向有效，也暴露出严重后果与当前是否触发被混为一谈、兼容性规则过宽、报告字段未强制、代理扇出缺少硬限制。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;two-col&quot;&gt;
    &lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;继续保持&lt;/p&gt;&lt;ul class=&quot;problem-list&quot;&gt;&lt;li&gt;只检查严重生产底线，不评价代码审美。&lt;/li&gt;&lt;li&gt;必须给出真实入口、代码位置、触发条件和因果链。&lt;/li&gt;&lt;li&gt;存量问题只有被本次改动引入或加重才进入判断。&lt;/li&gt;&lt;li&gt;相同根因必须合并，普通 CI 继续负责稳定工具检查。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;V1.1 改进&lt;/p&gt;&lt;ul class=&quot;plain-list&quot;&gt;&lt;li&gt;S 后果严重度与 T 触发确定性分开。&lt;/li&gt;&lt;li&gt;兼容性覆盖协议/API、配置语义、持久化身份与所有权。&lt;/li&gt;&lt;li&gt;结构化字段由普通程序校验并计算 verdict。&lt;/li&gt;&lt;li&gt;默认总 Agent 数不超过 3，超限必须批准。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;viz-grid&quot; style=&quot;margin-top:1.5rem&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;底线维度&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot;&gt;4&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;方案、正确性、稳定性、安全与变更&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;规则总量&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot;&gt;20&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;不因单次实战扩大范围&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;默认 Agent 上限&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;包括主 Agent&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;how&quot; aria-labelledby=&quot;how-title&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;how-title&quot;&gt;代码提交后怎样运行&lt;/h2&gt;&lt;p&gt;CI 固定审查基线，主 Agent 沿真实路径形成候选，少量验证 Agent 复核，普通程序验证机器合同并计算结果。&lt;/p&gt;&lt;/div&gt;
  &lt;ol class=&quot;review-flow&quot; aria-label=&quot;AI 代码检查执行流程&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;01&lt;/span&gt;&lt;strong&gt;固定基线&lt;/strong&gt;&lt;span&gt;base_commit、target_commit、target_branch、diff_selection_reason&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;02&lt;/span&gt;&lt;strong&gt;普通 CI&lt;/strong&gt;&lt;span&gt;构建、测试、覆盖率、安全检查&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;03&lt;/span&gt;&lt;strong&gt;创建隔离环境&lt;/strong&gt;&lt;span&gt;只读代码，不带生产凭据&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;04&lt;/span&gt;&lt;strong&gt;主 Agent 检查&lt;/strong&gt;&lt;span&gt;真实入口、调用链、数据流、副作用&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;05&lt;/span&gt;&lt;strong&gt;激活相关规则&lt;/strong&gt;&lt;span&gt;不按 20 条规则盲目扇出&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;06&lt;/span&gt;&lt;strong&gt;候选去重与验证&lt;/strong&gt;&lt;span&gt;每个候选最多一个验证 Agent&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;07&lt;/span&gt;&lt;strong&gt;生成机器报告&lt;/strong&gt;&lt;span&gt;JSON 给 CI，Markdown 给人&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;viz-badge&quot;&gt;08&lt;/span&gt;&lt;strong&gt;程序计算结果&lt;/strong&gt;&lt;span&gt;PASS、MANUAL_REVIEW、BLOCK、INCOMPLETE&lt;/span&gt;&lt;/li&gt;
  &lt;/ol&gt;
  &lt;div class=&quot;three-col&quot; style=&quot;margin-top:2rem&quot;&gt;
    &lt;div class=&quot;input-part&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;审查基线&lt;/span&gt;&lt;h3&gt;明确变更范围&lt;/h3&gt;&lt;p&gt;&lt;code&gt;base_commit&lt;/code&gt;、&lt;code&gt;target_commit&lt;/code&gt;、&lt;code&gt;diff_selection_reason&lt;/code&gt; 缺失时不得 BLOCK。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;input-part&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;机器合同&lt;/span&gt;&lt;h3&gt;字段可校验&lt;/h3&gt;&lt;p&gt;报告包含 severity、trigger_confidence、evidence_level、调用路径、触发条件、因果链和验证证据。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;input-part&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;项目说明&lt;/span&gt;&lt;h3&gt;补充业务事实&lt;/h3&gt;&lt;p&gt;关键数据、配置、真实规模、调用方、恢复要求和权威契约。&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;review&quot; aria-labelledby=&quot;review-title-2&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;review-title-2&quot;&gt;Codex 每次检查什么&lt;/h2&gt;&lt;p&gt;继续使用四个维度和 20 条规则，只激活与本次改动相关的规则族。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;review-grid&quot; role=&quot;list&quot;&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;D1 方案方向与数据流&lt;/strong&gt;&lt;span&gt;增长维度、全量扫描、远程调用、权威数据源、同步批处理&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;D2 业务结果与数据安全&lt;/strong&gt;&lt;span&gt;契约、不变量、边界计算、事务、幂等&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;D3 生产稳定性&lt;/strong&gt;&lt;span&gt;资源上限、超时取消、并发、泄漏、错误恢复&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;D4 安全与变更安全&lt;/strong&gt;&lt;span&gt;权限、输入、敏感数据、兼容性、迁移&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;CHG-001 协议/API&lt;/strong&gt;&lt;span&gt;请求语法、认证方案、响应字段、状态码、事件&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;CHG-001 配置语义&lt;/strong&gt;&lt;span&gt;已有配置继续被读取并保持原意&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;CHG-001 持久化身份&lt;/strong&gt;&lt;span&gt;用户、租户、所有权、幂等、缓存和外部账户标识&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;review-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;协议证据边界&lt;/strong&gt;&lt;span&gt;只凭模型记忆最高 E1；契约、标准、框架或测试支持 E2/E3&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;decision&quot; aria-labelledby=&quot;decision-title&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;decision-title&quot;&gt;怎样决定能否合并&lt;/h2&gt;&lt;p&gt;V1.1 将后果、触发确定性和证据分开。理论上很严重，不等于当前目标一定会触发。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;three-col decision&quot;&gt;
    &lt;div class=&quot;card decision-pass&quot;&gt;&lt;div class=&quot;decision-mark&quot;&gt;&lt;/div&gt;&lt;h3&gt;PASS&lt;/h3&gt;&lt;p&gt;没有发现满足完整阻断条件的底线缺陷，不代表代码优秀。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card decision-review&quot;&gt;&lt;div class=&quot;decision-mark&quot;&gt;&lt;/div&gt;&lt;h3&gt;MANUAL_REVIEW&lt;/h3&gt;&lt;p&gt;例如 S3 + T2 + E2/E3：后果严重、条件现实，但当前环境是否触发尚未证明。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card decision-stop&quot;&gt;&lt;div class=&quot;decision-mark&quot;&gt;&lt;/div&gt;&lt;h3&gt;BLOCK&lt;/h3&gt;&lt;p&gt;S3 + T3 + E2/E3，并且由本次变更引入或加重，触发条件和因果链完整。&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;must-have&quot; aria-label=&quot;阻止合并完整条件&quot;&gt;
    &lt;div&gt;&lt;strong&gt;S3 后果&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;触发后造成严重生产影响&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;T3 触发&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;当前部署、配置、调用方或输入已证明&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;E2/E3 证据&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;代码证实或已经验证&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;本次变更归因&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;引入、扩大或变得可触发&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;具体触发条件&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;输入、配置、规模或运行状态&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;strong&gt;完整因果链&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;真实入口到生产后果，且不是风格偏好&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;input-part&quot; style=&quot;margin-top:1.5rem&quot;&gt;&lt;strong&gt;统一场景矩阵&lt;/strong&gt;&lt;p&gt;&lt;code&gt;S3 + T3 + E2/E3 + 本次引入 + 完整因果链 → BLOCK&lt;/code&gt;&lt;br&gt;&lt;code&gt;S3 + T2 + E2/E3 → MANUAL_REVIEW&lt;/code&gt;&lt;br&gt;&lt;code&gt;S2 + T3 + E3 → MANUAL_REVIEW&lt;/code&gt;&lt;br&gt;&lt;code&gt;报告字段缺失或基线不明确 → INCOMPLETE&lt;/code&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;input-part&quot; style=&quot;margin-top:1.5rem&quot;&gt;&lt;strong&gt;INCOMPLETE 不能当作 PASS&lt;/strong&gt;&lt;p&gt;基线不明确、强制字段缺失、枚举非法、检查超时或机器故障时结果为 INCOMPLETE。总体优先级：INCOMPLETE &amp;gt; BLOCK &amp;gt; MANUAL_REVIEW &amp;gt; PASS。&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;security&quot; aria-labelledby=&quot;security-title&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;security-title&quot;&gt;专用机器的安全与资源边界&lt;/h2&gt;&lt;p&gt;每次检查使用全新任务，只有完成只读代码检查所需的最小权限和受控 Agent 预算。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;two-col&quot;&gt;
    &lt;div class=&quot;security-side&quot;&gt;&lt;h3&gt;允许&lt;/h3&gt;&lt;ul class=&quot;plain-list&quot;&gt;&lt;li&gt;读取明确 base/target 的代码和普通 CI 证据。&lt;/li&gt;&lt;li&gt;主 Agent 沿真实路径检查并形成候选。&lt;/li&gt;&lt;li&gt;每个候选最多一个独立验证 Agent。&lt;/li&gt;&lt;li&gt;生成结构化 JSON 和可读 Markdown 报告。&lt;/li&gt;&lt;li&gt;记录 Agent 数、token、耗时和重试。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;security-side&quot;&gt;&lt;h3&gt;不允许&lt;/h3&gt;&lt;ul class=&quot;plain-list&quot;&gt;&lt;li&gt;访问生产数据库、云平台、部署或签名凭据。&lt;/li&gt;&lt;li&gt;修改、提交、合并或部署代码。&lt;/li&gt;&lt;li&gt;为每条规则、每个文件或每个角度分别启动 Agent。&lt;/li&gt;&lt;li&gt;没有候选时启动验证 Agent。&lt;/li&gt;&lt;li&gt;超过默认 3 Agent 而没有 CI 配置或人工显式批准。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;input-part&quot; style=&quot;margin-top:1.5rem&quot;&gt;&lt;strong&gt;默认总 Agent 数不超过 3&lt;/strong&gt;&lt;p&gt;包括主 Agent。执行器必须设置硬上限；自然语言“节制使用”不能替代限制。超限必须记录计划数量、实际数量和原因。&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;pilot&quot; aria-labelledby=&quot;pilot-title&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;pilot-title&quot;&gt;怎样从试点走向正式使用&lt;/h2&gt;&lt;p&gt;规则先经过正例、反例和证据不足案例，再在真实 PR 中 report-only；一次成功命中不能证明整个 Rubric 已成熟。&lt;/p&gt;&lt;/div&gt;
  &lt;ol class=&quot;pilot-timeline&quot;&gt;
    &lt;li&gt;&lt;strong&gt;建立规则验证矩阵&lt;/strong&gt;&lt;span&gt;每条拟阻断规则至少一个正例、一个不得阻断的反例、一个应 MANUAL_REVIEW 的证据不足案例。&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;历史代码盲测&lt;/strong&gt;&lt;span&gt;至少 15 个已知严重问题和 15 个正常改动；严重案例重复运行三次。&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;真实 PR 只出报告&lt;/strong&gt;&lt;span&gt;三个运行中项目持续两到四周，人工标记正确、错误或证据不足。&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;满足条件后按项目启用&lt;/strong&gt;&lt;span&gt;记录规则稳定性、重复根因、Agent 数、token、耗时和人工推翻原因。&lt;/span&gt;&lt;/li&gt;
  &lt;/ol&gt;
  &lt;div class=&quot;three-col&quot; style=&quot;margin-top:1.75rem&quot;&gt;
    &lt;div class=&quot;input-part&quot;&gt;&lt;strong&gt;正例&lt;/strong&gt;&lt;p&gt;验证能否命中真实严重缺陷和正确规则。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;input-part&quot;&gt;&lt;strong&gt;反例&lt;/strong&gt;&lt;p&gt;验证硬上限、兼容路径或充分保护不会被错误阻断。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;input-part&quot;&gt;&lt;strong&gt;证据不足&lt;/strong&gt;&lt;p&gt;验证缺少配置、调用方、规模或契约时会降为人工复核。&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;ownership&quot; aria-labelledby=&quot;ownership-title&quot;&gt;
  &lt;div class=&quot;section-head&quot;&gt;&lt;h2 id=&quot;ownership-title&quot;&gt;需要交付什么，谁来维护&lt;/h2&gt;&lt;p&gt;共享仓库维护 Skill、20 条规则、机器合同、校验脚本和案例矩阵；项目维护业务上下文和接入配置。&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;ownership&quot;&gt;
    &lt;div&gt;&lt;h3&gt;公司共享仓库&lt;/h3&gt;&lt;ul class=&quot;deliver-list&quot;&gt;&lt;li&gt;公司代码检查 Skill 和短 Prompt。&lt;/li&gt;&lt;li&gt;V1.1 规则集与结构化 schema。&lt;/li&gt;&lt;li&gt;verdict 校验程序和报告模板。&lt;/li&gt;&lt;li&gt;正例、反例、证据不足案例矩阵。&lt;/li&gt;&lt;li&gt;Agent 硬上限与资源统计。&lt;/li&gt;&lt;li&gt;CI 示例和专用机器安全说明。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div&gt;&lt;h3&gt;每个接入项目&lt;/h3&gt;&lt;ul class=&quot;deliver-list&quot;&gt;&lt;li&gt;固定 Skill 和规则版本的短配置。&lt;/li&gt;&lt;li&gt;项目入口、不变量、真实规模、配置和权威契约说明。&lt;/li&gt;&lt;li&gt;调用共享命令的 CI 任务。&lt;/li&gt;&lt;li&gt;人工标注和放行负责人。&lt;/li&gt;&lt;li&gt;项目特有规则和案例。&lt;/li&gt;&lt;li&gt;何时从 report-only 进入阻断的项目决定。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;freedom-line&quot;&gt;&lt;div&gt;&lt;strong&gt;公司统一最低要求&lt;/strong&gt;&lt;span&gt;审查基线、底线范围、S/T/E 证据、机器合同和资源上限&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div&gt;&lt;strong&gt;个人和团队自由发挥&lt;/strong&gt;&lt;span&gt;AI 工具、提示词、开发步骤、额外规则和完整 Harness&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;p class=&quot;final-note&quot;&gt;V1.1 目标：让严重、确定、证据充分的底线缺陷更难进入主分支，同时让不确定风险回到人工判断，并把代理成本控制在可审计范围内。&lt;/p&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

&lt;/body&gt;
